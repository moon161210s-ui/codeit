<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>onboarding</title>
    </title>
</head>
<body>
    <h1 style="font-size: 7ch;">누구세요?</h1>
    <p><label for="name">이름</label></p>
    <input type="text" id="name" placeholder="이름을 입력해 주세요">
        <style>
         input {
              width: 300px;
             height: 40px;
                padding: 0 12px;
             font-size: 16px;
             border: 1px solid #ccc;
             border-radius: 12px;
              box-sizing: border-box;}
        </style>
    <button onclick="welcome()">확인</button>
    
    
    <script>
  function welcome() {
    const name = document.getElementById("name").value;
    if (name === "") {
      alert("이름을 입력해 주세요");
    } else {
      alert("환영합니다 " + name + " 님");
      location.href = "home.html";
    }
  }
</script>
</body>
</html>
